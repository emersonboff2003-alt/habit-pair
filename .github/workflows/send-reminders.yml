name: Send Reminders

on:
  schedule:
    # Horário do Brasil (UTC-3): 7h-22h no fuso local = 10h-23h e 0h-1h UTC.
    - cron: "*/15 10-23 * * *"
    - cron: "*/15 0-1 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-reminders cron
        run: |
          curl -sS -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.VERCEL_APP_URL || 'https://habit-pair.vercel.app' }}/api/cron/send-reminders"