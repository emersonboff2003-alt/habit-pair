name: Send Reminders

on:
  schedule:
    - cron: "*/15 7-22 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-reminders cron
        run: |
          curl -sS -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.VERCEL_APP_URL || 'https://habit-pair.vercel.app' }}/api/cron/send-reminders"